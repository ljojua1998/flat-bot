# CI/CD: ყოველ push-ზე main-ში, სერვერზე შედის, კოდს ქაჩავს და თავიდან უშვებს.
# საჭიროა GitHub-ის Secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # ღილაკით ხელით გაშვების საშუალებაც

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/flat-bot
            git pull origin main
            docker compose up -d --build
            docker image prune -f
